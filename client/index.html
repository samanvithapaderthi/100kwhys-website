<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050d45" />
    <meta name="description" content="100,000 Whys for Kids — a full-color illustrated encyclopedia for curious kids ages 6–13." />
    <link rel="canonical" href="https://100000whysforkids.com/" />
    <link rel="icon" type="image/png" href="/assets/whys-starbook-mark.png" />
    <meta property="og:title" content="100,000 Whys for Kids" />
    <meta property="og:description" content="Big questions. Bright answers. A full-color illustrated encyclopedia for curious kids." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://100000whysforkids.com/" />
    <title>100,000 Whys for Kids — Big questions. Bright answers.</title>
    <script>
      (function (window, document) {
        if (window.oaiq) return;
        function queue() {
          queue.q.push(arguments);
        }
        queue.q = [];
        window.oaiq = queue;

        const sdk = document.createElement("script");
        sdk.async = true;
        sdk.src = "https://bzrcdn.openai.com/sdk/oaiq.min.js";
        document.head.appendChild(sdk);
      })(window, document);

      window.oaiq("init", { pixelId: "BXiS9T5eAnrZhRs6vJdpBy", debug: true });

      document.addEventListener("click", function (event) {
        const link = event.target.closest?.("a[href]");
        if (!link || typeof window.oaiq !== "function") return;

        const host = link.hostname;
        if (host === "amazon.com" || host.endsWith(".amazon.com")) {
          window.oaiq("measure", "custom", { type: "custom" }, {
            custom_event_name: "outbound_click"
          });
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
